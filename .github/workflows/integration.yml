name: Integration Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          token: ''
          filters: |
            python:
              - 'sayiir-core/**'
              - 'sayiir-persistence/**'
              - 'sayiir-postgres/**'
              - 'sayiir-runtime/**'
              - 'sayiir-py/**'
              - 'sayiir-python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            node:
              - 'sayiir-core/**'
              - 'sayiir-persistence/**'
              - 'sayiir-postgres/**'
              - 'sayiir-runtime/**'
              - 'sayiir-node/**'
              - 'sayiir-nodejs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  python-integration:
    name: Python Integration
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Build Python wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: sayiir-python
          args: --out dist

      - name: Install wheel and test deps
        run: uv pip install --system sayiir-python/dist/*.whl pytest "testcontainers[postgres]"

      - name: Run integration tests
        run: pytest sayiir-python/tests/test_worker_integration.py -v

  node-integration:
    name: Node.js Integration
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Build native addon
        run: cargo build -p sayiir-node --release

      - name: Copy native addon
        run: |
          mkdir -p sayiir-nodejs/native
          cp target/release/libsayiir_node.so sayiir-nodejs/native/sayiir-node.node

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0

      - name: Install dependencies
        working-directory: sayiir-nodejs
        run: pnpm install --no-frozen-lockfile

      - name: Run integration tests
        working-directory: sayiir-nodejs
        run: pnpm vitest run --config vitest.integration.config.mts
