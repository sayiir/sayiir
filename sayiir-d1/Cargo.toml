[package]
name = "sayiir-d1"
description = "Cloudflare D1 (SQLite) persistence backend for Sayiir workflow engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lib]
name = "sayiir_d1"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
sayiir-core = { workspace = true, default-features = false }
sayiir-persistence = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
# Pinned to 0.8 to match sqlx-d1 0.4.x, which depends on sqlx 0.8. The workspace
# sqlx (0.9, used by sayiir-postgres) is independent — sayiir-d1 shares no sqlx
# types with other crates, so the two versions coexist without conflict.
sqlx = { version = "0.9" }

# D1
sqlx-d1 = { version = "0.4", optional = true }
worker = { version = "0.8", features = ["d1"], optional = true }  # pinned to match sqlx-d1

[features]
default = ["d1"]
sqlite = [
    "sqlx/sqlite",
    "sqlx/runtime-tokio",
]
d1 = [
    "sqlx-d1",
    "worker",
]
